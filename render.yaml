services:
  - type: web
    name: exampilot-api
    runtime: docker
    plan: free
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: exampilot-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_ORIGINS
        value: https://your-app.vercel.app
      - key: FRONTEND_ORIGIN_REGEX
        value: https://.*\.vercel\.app
      - key: SOLVER_WORKERS
        value: "2"
      - key: SOLVER_TIME_LIMIT_S
        value: "10"
      - key: AUTO_SEED_ON_EMPTY
        value: "true"

databases:
  - name: exampilot-db
    plan: free
