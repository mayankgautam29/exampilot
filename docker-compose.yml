services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: exampilot
      POSTGRES_PASSWORD: exampilot
      POSTGRES_DB: exampilot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exampilot"]
      interval: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    profiles: ["full"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://exampilot:exampilot@postgres:5432/exampilot
      FRONTEND_ORIGINS: http://localhost:3000
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-compose}
      AUTO_SEED_ON_EMPTY: "true"
    ports:
      - "8000:8000"

volumes:
  pgdata:
